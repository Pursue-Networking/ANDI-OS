# ANDI dev stack. Fresh volume applies schema and seed automatically.
# Reset everything with: docker compose down -v && docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: andi-postgres
    environment:
      POSTGRES_USER: andi
      POSTGRES_PASSWORD: andi
      POSTGRES_DB: andi
    ports:
      - "5432:5432"
    volumes:
      - andi_pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andi -d andi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: andi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  andi_pgdata:
